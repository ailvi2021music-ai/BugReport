<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Bug Report Trainer</title>
  <meta name="theme-color" content="#071221" />

  <style>
    :root{
      --bg0:#050914;
      --bg1:#071221;
      --line:rgba(140,195,255,.14);
      --text:#EAF2FF;
      --muted2:rgba(234,242,255,.55);
      --accent:#59C3FF;
      --good:#3CE07A;
      --warn:#FFD166;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --shadow2: 0 10px 30px rgba(0,0,0,.35);
      --r:18px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, system-ui, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      -webkit-font-smoothing:antialiased;
      -webkit-text-size-adjust:100%;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(89,195,255,.20), transparent 60%),
        radial-gradient(900px 700px at 80% 30%, rgba(75,227,209,.14), transparent 55%),
        radial-gradient(900px 700px at 60% 90%, rgba(255,92,122,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      transform: translateZ(0);
      will-change: transform;
    }

    .wrap{
      max-width: 680px;
      margin: 0 auto;
      padding: 18px 14px 48px;
    }

    .card{
      background: linear-gradient(180deg, rgba(11,23,48,.92), rgba(10,20,43,.90));
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      overflow:hidden;
      margin-top: 14px;
    }

    .cardHead{
      padding: 14px 16px 12px;
      border-bottom:1px solid rgba(140,195,255,.10);
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:nowrap;
    }
    .cardBody{ padding: 12px 14px 14px; }

    .hidden{ display:none !important; }

    .seg{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }
    .segBtn{
      border:1px solid rgba(234,242,255,.12);
      background: rgba(234,242,255,.06);
      color: rgba(234,242,255,.80);
      padding: 8px 10px;
      border-radius: 999px;
      cursor:pointer;
      font-size: 13px;
      user-select:none;
      transition: filter .12s ease, transform .08s ease, background .12s ease, border-color .12s ease;
      white-space: nowrap;
    }
    .segBtn:hover{ filter: brightness(1.06); }
    .segBtn:active{ transform: translateY(1px); }
    .segBtn.active{
      border-color: rgba(89,195,255,.35);
      background: rgba(89,195,255,.12);
      color: rgba(234,242,255,.92);
    }

    .q{
      padding: 12px;
      border: 1px solid rgba(140,195,255,.12);
      border-radius: 14px;
      background: rgba(5,9,20,.35);
      margin-bottom: 10px;
    }
    .q label{
      display:flex;
      gap:10px;
      align-items:center;
      color: rgba(234,242,255,.90);
      font-size: 13px;
      margin-bottom: 8px;
      user-select:none;
      cursor: default;
    }
    .n{
      width: 22px; height: 22px;
      border-radius: 8px;
      display:grid; place-items:center;
      background: rgba(89,195,255,.14);
      border: 1px solid rgba(89,195,255,.22);
      color: rgba(234,242,255,.92);
      font-size: 12px;
      flex: 0 0 auto;
      user-select:none;
      cursor: default;
    }

    textarea, input, select{
      width:100%;
      background: rgba(234,242,255,.06);
      border: 1px solid rgba(140,195,255,.16);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 11px;
      outline: none;
      font-size: 14px;
      line-height: 1.35;
    }
    textarea{ min-height: 54px; resize: vertical; }
    textarea:focus, input:focus, select:focus{
      border-color: rgba(89,195,255,.38);
      box-shadow: 0 0 0 4px rgba(89,195,255,.10);
    }

    select{
      background-color: rgba(234,242,255,.06);
      color: rgba(234,242,255,.92);
      border: 1px solid rgba(140,195,255,.16);
    }
    select option{
      background-color: #0b162e;
      color: #eaf2ff;
    }

    .row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    @media (max-width:520px){
      .row{ grid-template-columns: 1fr; }
      .cardHead{ flex-wrap:wrap; }
    }

    .btnRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 12px;
      align-items:center;
      justify-content:flex-start;
    }
    .btnRow.split{ justify-content:space-between; }
    .btnGroup{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .btn{
      border:1px solid rgba(89,195,255,.25);
      color: rgba(234,242,255,.92);
      background: rgba(89,195,255,.10);
      padding: 11px 14px;
      border-radius: 14px;
      cursor:pointer;
      font-size:14px;
      letter-spacing:.2px;
      transition: transform .08s ease, filter .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{ filter: brightness(1.06); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      background: linear-gradient(180deg, rgba(89,195,255,.30), rgba(89,195,255,.14));
      border-color: rgba(89,195,255,.40);
      box-shadow: 0 14px 40px rgba(89,195,255,.10);
    }
    .btn.ghost{
      background: transparent;
      border-color: rgba(234,242,255,.12);
      color: rgba(234,242,255,.75);
    }
    .btn.danger{
      background: rgba(255,92,122,.10);
      border-color: rgba(255,92,122,.25);
      color: rgba(234,242,255,.88);
    }
    .btn[disabled]{
      opacity:.45;
      cursor:not-allowed;
      filter:none;
      transform:none;
    }
    .btn.back{
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 13px;
      background: rgba(234,242,255,.06);
      border-color: rgba(234,242,255,.12);
      color: rgba(234,242,255,.86);
    }

    .outBlock{
      padding: 12px 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(140,195,255,.12);
      background: rgba(5,9,20,.35);
      margin-bottom: 10px;
      animation: fadeIn .18s ease;
    }
    @keyframes fadeIn{
      from{ opacity: 0; transform: translateY(2px); }
      to{ opacity: 1; transform: translateY(0); }
    }
    .outTitle{
      display:flex;
      align-items:center;
      gap:10px;
      margin: 0 0 10px;
      font-size: 13px;
      color: rgba(234,242,255,.92);
      letter-spacing:.2px;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .dot{
      width: 10px; height: 10px; border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(89,195,255,.12);
      flex: 0 0 auto;
    }
    .dot.good{ background: var(--good); box-shadow: 0 0 0 4px rgba(60,224,122,.10); }
    .dot.warn{ background: var(--warn); box-shadow: 0 0 0 4px rgba(255,209,102,.10); }

    pre{
      margin:0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(234,242,255,.92);
    }

    .small{
      color: var(--muted2);
      font-size: 12px;
      line-height: 1.35;
      margin-top: 8px;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(10,20,43,.92);
      border: 1px solid rgba(89,195,255,.20);
      color: rgba(234,242,255,.92);
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 99;
      max-width: min(520px, calc(100vw - 24px));
      text-align:center;
      font-size: 13px;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    .wizardShell{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .wizardTop{
      display:flex;
      justify-content:space-between;
      alignitems:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom: 4px;
    }
    .progress{
      color: rgba(234,242,255,.78);
      font-size: 12px;
      user-select:none;
      cursor: default;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(234,242,255,.14);
      background: rgba(234,242,255,.06);
      color: rgba(234,242,255,.86);
      user-select:none;
      cursor: default;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <section class="card" id="mainCard">
      <div class="cardHead">
        <button class="btn back hidden" id="backBtn" type="button">← Назад</button>

        <div class="seg" id="modeSeg" aria-label="Режим ввода">
          <button class="segBtn active" id="modeForm" type="button">Форма</button>
          <button class="segBtn" id="modeWizard" type="button">По шагам</button>
        </div>
      </div>

      <div class="cardBody">

        <!-- INPUT PANEL -->
        <div id="panelInput">

          <!-- FORM MODE -->
          <div id="formMode">
            <div class="q">
              <label><span class="n">1</span> Что ты сделал?</label>
              <textarea id="q1"></textarea>
            </div>

            <div class="q">
              <label><span class="n">2</span> Что произошло?</label>
              <textarea id="q2"></textarea>
            </div>

            <div class="q">
              <label><span class="n">3</span> Что должно было произойти?</label>
              <textarea id="q3"></textarea>
            </div>

            <div class="row">
              <div class="q" style="margin:0;">
                <label><span class="n">4</span> Где это произошло?</label>
                <input id="q4" />
              </div>

              <div class="q" style="margin:0;">
                <label><span class="n">5</span> Насколько это критично?</label>
                <select id="q5">
                  <option value="Low">Низко</option>
                  <option value="Medium" selected>Средне</option>
                  <option value="High">Высоко</option>
                  <option value="Critical">Критично</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="q" style="margin:0;">
                <label><span class="n">6</span> Устройство / версия</label>
                <input id="env" />
              </div>

              <div class="q" style="margin:0;">
                <label><span class="n">7</span> Тип бага</label>
                <select id="type">
                  <option value="functional" selected>Функциональный</option>
                  <option value="ui">UI/Дизайн</option>
                  <option value="typo">Орфография/Текст</option>
                  <option value="crash">Краш/Зависание</option>
                </select>
              </div>
            </div>

            <div class="btnRow split">
              <div class="btnGroup">
                <button class="btn primary" id="genForm" type="button">Сгенерировать</button>
                <button class="btn" id="newReport" type="button">Новый отчёт</button>
              </div>
              <div class="btnGroup">
                <button class="btn ghost" id="demo" type="button">Демо</button>
              </div>
            </div>
          </div>

          <!-- WIZARD MODE -->
          <div id="wizardMode" class="hidden">
            <div class="wizardShell">
              <div class="wizardTop">
                <div class="progress" id="wizProgress">Шаг 1/7</div>
                <div class="small">
                  <span class="kbd">Enter</span> = далее • <span class="kbd">Shift+Enter</span> = новая строка
                </div>
              </div>

              <div class="q" id="wizBox">
                <label id="wizLabel"><span class="n" id="wizN">1</span> —</label>
                <div id="wizField"></div>
                <div class="small" id="wizHelp"></div>
              </div>

              <div class="btnRow">
                <button class="btn ghost" id="wizBack" type="button">Назад</button>
                <button class="btn primary" id="wizNext" type="button">Далее</button>
                <button class="btn primary hidden" id="wizGen" type="button">Сгенерировать</button>
                <button class="btn" id="newReport2" type="button">Новый отчёт</button>
              </div>

              <div class="small">
                Можно переключиться обратно в “Форму” — ответы не потеряются.
              </div>
            </div>
          </div>
        </div>

        <!-- RESULT PANEL -->
        <div id="panelResult" class="hidden">
          <div class="seg" style="justify-content:flex-start; margin-bottom:12px;">
            <button class="segBtn active" id="showEN" type="button">EN</button>
            <button class="segBtn" id="showRU" type="button">RU</button>
          </div>

          <div class="outBlock" id="blockEN">
            <div class="outTitle">
              <span style="display:flex; align-items:center; gap:10px;"><span class="dot"></span> Bug Report (EN)</span>
              <span class="small" id="sevPill">—</span>
            </div>
            <pre id="outEN">—</pre>
          </div>

          <div class="outBlock hidden" id="blockRU">
            <div class="outTitle">
              <span style="display:flex; align-items:center; gap:10px;"><span class="dot good"></span> Перевод (RU)</span>
              <span class="small" id="envPill">—</span>
            </div>
            <pre id="outRU">—</pre>
          </div>

          <div class="outBlock" id="blockAfter">
            <div class="outTitle"><span style="display:flex; align-items:center; gap:10px;"><span class="dot warn"></span> Что дальше</span></div>
            <div class="small" id="afterText">—</div>

            <div class="btnRow">
              <button class="btn primary" id="goVocab" type="button" disabled>Перейти в словарь</button>
              <button class="btn" id="newReport3" type="button">Новый отчёт</button>
            </div>
          </div>
        </div>

        <!-- VOCAB PANEL -->
        <div id="panelVocab" class="hidden">
          <div class="outBlock">
            <div class="outTitle">
              <span style="display:flex; align-items:center; gap:10px;"><span class="dot warn"></span> Vocabulary (new)</span>
              <span class="small" id="vocCountPill">0</span>
            </div>
            <pre id="outV">—</pre>

            <div class="btnRow" style="margin-top:10px;">
              <button class="btn primary" id="copy" type="button">Copy</button>
              <button class="btn" id="newReport4" type="button">Новый отчёт</button>
              <button class="btn danger" id="resetVocab3" type="button">Сбросить словарь</button>
            </div>
          </div>
        </div>

      </div>
    </section>

  </div>

  <div class="toast" id="toast">OK</div>

<script>
  const $ = (id) => document.getElementById(id);

  function on(id, evt, fn){
    const el = $(id);
    if(el) el.addEventListener(evt, fn);
  }

  function toast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"), 1200);
  }

  function cleanSpaces(s){ return (s||"").replace(/\s+/g," ").trim(); }

  function extractQuotedUI(text){
    const t = text || "";
    const matches = [];
    const re = /["“«](.+?)["”»]/g;
    let m;
    while ((m = re.exec(t)) !== null){
      const v = cleanSpaces(m[1]);
      if (v && v.length <= 50) matches.push(v);
    }
    return [...new Set(matches)];
  }

  const state = {
    tab: "input",           // input | result | vocab
    inputMode: "form",      // form | wizard
    wizardStep: 0,
    lastVocabLines: "",
    lastVocabCount: 0,
    demoOn: false
  };

  const panels = {
    input: $("panelInput"),
    result: $("panelResult"),
    vocab: $("panelVocab")
  };

  function setTab(name){
    state.tab = name;

    Object.entries(panels).forEach(([k, el])=>{
      el.classList.toggle("hidden", k !== name);
    });

    // mode selector only in input
    $("modeSeg").classList.toggle("hidden", name !== "input");

    // back arrow only outside input
    $("backBtn").classList.toggle("hidden", name === "input");

    if(name === "input") focusFirstInput();
  }

  function focusFirstInput(){
    if(state.inputMode === "form"){
      $("q1").focus();
    }else{
      wizardFocus();
    }
  }

  function setInputMode(mode){
    state.inputMode = mode;
    $("modeForm").classList.toggle("active", mode === "form");
    $("modeWizard").classList.toggle("active", mode === "wizard");
    $("formMode").classList.toggle("hidden", mode !== "form");
    $("wizardMode").classList.toggle("hidden", mode !== "wizard");
    if(mode === "wizard") renderWizard();
    focusFirstInput();
  }

  on("modeForm","click", ()=>setInputMode("form"));
  on("modeWizard","click", ()=>setInputMode("wizard"));

  // Back button behavior:
  // - from result -> input
  // - from vocab  -> result
  on("backBtn","click", ()=>{
    if(state.tab === "vocab") setTab("result");
    else setTab("input");
  });

  function ruLocationToEn(locRu){
    const s = (locRu || "").trim().toLowerCase();
    const dict = new Map([
      ["на главном экране", "the main screen"],
      ["главный экран", "the main screen"],
      ["на главной странице", "the main page"],
      ["главная страница", "the main page"],
      ["на странице профиля", "the profile page"],
      ["страница профиля", "the profile page"],
      ["профиль", "the profile page"],
      ["на странице настроек", "the settings page"],
      ["на экране настроек", "the settings screen"],
      ["настройки", "the settings screen"],
      ["экран входа", "the login screen"],
      ["логин", "the login screen"]
    ]);
    if (dict.has(s)) return dict.get(s);

    const hasCyr = /[а-яё]/i.test(locRu || "");
    if (!hasCyr && locRu) return locRu;

    return "the specified screen";
  }

  const LS_KEY = "bugTrainer_knownVocab_v4";

  function loadKnown(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return new Set(arr);
    }catch{
      return new Set();
    }
  }
  function saveKnown(set){
    localStorage.setItem(LS_KEY, JSON.stringify([...set]));
  }

  const STOP = new Set([
    "the","a","an","to","of","and","or","in","on","at","with","for","from","into","by","as",
    "is","are","was","were","be","been","being","it","this","that","these","those","there",
    "i","you","we","they","he","she","my","your","our","their","his","her",
    "do","does","did","not","no","yes","but","if","then","than","when","while","because",
    "should","could","would","can","may","might","will"
  ]);

  const FIXED_TERMS = new Map([
    ["Steps to reproduce", "Шаги воспроизведения"],
    ["Actual result", "Фактический результат"],
    ["Expected result", "Ожидаемый результат"],
    ["Environment", "Окружение"],
    ["Title", "Заголовок"],

    ["does not respond", "не реагирует"],
    ["nothing happens", "ничего не происходит"],
    ["should appear", "должно появиться"],
    ["should be", "должно быть"],
    ["could be", "могло бы быть"],
    ["unable to", "не удаётся"],
    ["fails to", "не выполняет / не удаётся"],

    ["the app freezes", "приложение зависает"],
    ["the app crashes", "приложение падает (краш)"],
    ["error message", "сообщение об ошибке"],
    ["ui elements overlap", "элементы интерфейса перекрываются"]
  ]);

  const WORDS = new Map([
    ["button","кнопка"],
    ["screen","экран"],
    ["page","страница"],
    ["profile","профиль"],
    ["settings","настройки"],
    ["login","вход"],
    ["save","сохранить"],
    ["submit","отправить"],
    ["error","ошибка"],
    ["message","сообщение"],
    ["freeze","зависает"],
    ["crash","краш / падение"],
    ["unresponsive","не реагирует"],
    ["overlap","перекрывает"],
    ["typo","опечатка"],
    ["misspell","написать с ошибкой"],
    ["appear","появиться"],
    ["unexpected","неожиданно"],
    ["expected","ожидаемый"],
    ["actual","фактический"],
    ["reproduce","воспроизвести"],
    ["steps","шаги"],
    ["result","результат"],
    ["environment","окружение"]
  ]);

  function normalizeToken(w){
    w = (w||"").toLowerCase().replace(/[^a-z0-9\-]+/g,"").trim();
    if(!w) return "";
    if (w.endsWith("ing") && w.length > 5) w = w.slice(0,-3);
    else if (w.endsWith("ed") && w.length > 4) w = w.slice(0,-2);
    else if (w.endsWith("es") && w.length > 4) w = w.slice(0,-2);
    else if (w.endsWith("s") && w.length > 3) w = w.slice(0,-1);

    if (w === "freezes") w = "freeze";
    if (w === "crashes") w = "crash";
    if (w === "overlaps") w = "overlap";
    if (w === "misspelled") w = "misspell";
    return w;
  }

  function collectVocab(enReport){
    const found = [];
    const lower = enReport.toLowerCase();

    for (const [k, ru] of FIXED_TERMS.entries()){
      if (lower.includes(k.toLowerCase())) found.push({en:k, ru});
    }

    const rawTokens = enReport.split(/\s+/g).map(t=>t.replace(/[.,:;()"]/g,""));
    for(const t of rawTokens){
      const n = normalizeToken(t);
      if(!n || STOP.has(n)) continue;
      if (n.length < 3) continue;
      const ru = WORDS.get(n);
      if(!ru) continue;
      found.push({en:n, ru});
    }

    const uniq = new Map();
    for(const item of found){
      const key = item.en.toLowerCase();
      if(!uniq.has(key)) uniq.set(key, item);
    }
    return [...uniq.values()];
  }

  function guessTitle(type, uiTexts, q2ru){
    const primary = uiTexts[0] ? `"${uiTexts[0]}"` : "Button";
    if(type === "crash") return `${primary} causes the app to freeze`;
    if(type === "ui") return `${primary} UI issue on screen`;
    if(type === "typo") return `Typo on screen`;
    const t = (q2ru||"").toLowerCase();
    if (t.includes("не реаг") || t.includes("ничего") || t.includes("не происходит")) return `${primary} does not respond`;
    return `${primary} behaves incorrectly`;
  }

  function buildEN({q1,q2,q3,q4,severity,env,type}){
    const uiFromAll = [...new Set([
      ...extractQuotedUI(q1),
      ...extractQuotedUI(q2),
      ...extractQuotedUI(q3),
      ...extractQuotedUI(q4),
    ])];

    const title = guessTitle(type, uiFromAll, q2);

    const steps = [];
    const locEn = q4 ? ruLocationToEn(q4) : "";
    steps.push(locEn ? `Open ${locEn}.` : `Open the application.`);
    if(uiFromAll[0]) steps.push(`Click "${uiFromAll[0]}".`);
    else steps.push(`Perform the described action.`);

    let actual = "Unexpected behavior occurs.";
    let expected = "The expected behavior should occur.";

    const q2l = (q2||"").toLowerCase();
    if (q2l.includes("не реаг") ) actual = `The button does not respond.`;
    if (q2l.includes("ничего") || q2l.includes("не происходит")) actual = "Nothing happens.";
    if (q2l.includes("завис")) actual = "The app freezes.";
    if (q2l.includes("краш") || q2l.includes("вылет") || q2l.includes("падает")) actual = "The app crashes.";
    if (q2l.includes("ошибк")) actual = "An error message appears.";
    if (q2l.includes("перекры") || q2l.includes("наезж")) actual = "UI elements overlap.";

    const q3l = (q3||"").toLowerCase();
    if (q3l.includes("появ") || q3l.includes("откры")) expected = "The expected screen/window should appear.";
    if (q3l.includes("сохран")) expected = "The data should be saved successfully.";
    if (q3l.includes("войти") || q3l.includes("логин") || q3l.includes("парол")) expected = "The login screen should appear.";
    if (q3l.includes("не перекры") || q3l.includes("не наезж")) expected = "UI elements should not overlap.";

    const lines = [];
    lines.push(`Title: ${title}`);
    lines.push("");
    lines.push("Steps to reproduce:");
    steps.forEach((s,i)=>lines.push(`${i+1}. ${s}`));
    lines.push("");
    lines.push("Actual result:");
    lines.push(actual);
    lines.push("");
    lines.push("Expected result:");
    lines.push(expected);
    lines.push("");
    lines.push(`Severity: ${severity}`);
    if(env) lines.push(`Environment: ${env}`);

    return lines.join("\n");
  }

  function buildRU({q1,q2,q3,q4,severity,env}){
    const lines = [];
    lines.push(`Заголовок: ${cleanSpaces(q2) ? cleanSpaces(q2) : "Некорректное поведение"}`);
    lines.push("");
    lines.push("Шаги воспроизведения:");
    lines.push(`1. ${q4 ? "Открыть " + q4 : "Открыть приложение"}`);
    lines.push(`2. ${cleanSpaces(q1) ? cleanSpaces(q1) : "Выполнить действие"}`);
    lines.push("");
    lines.push("Фактический результат:");
    lines.push(cleanSpaces(q2) || "Происходит некорректное поведение.");
    lines.push("");
    lines.push("Ожидаемый результат:");
    lines.push(cleanSpaces(q3) || "Ожидаемое поведение.");
    lines.push("");
    lines.push(`Критичность: ${severity}`);
    if (env) lines.push(`Окружение: ${env}`);
    return lines.join("\n");
  }

  function gatherInputs(){
    return {
      q1: cleanSpaces($("q1").value),
      q2: cleanSpaces($("q2").value),
      q3: cleanSpaces($("q3").value),
      q4: cleanSpaces($("q4").value),
      severity: $("q5").value,
      env: cleanSpaces($("env").value),
      type: $("type").value
    };
  }

  function validateInputs(data){
    if(!data.q2 || !data.q3){
      toast("Заполни: Что произошло + Что должно было произойти");
      return false;
    }
    return true;
  }

  function generate(){
    const data = gatherInputs();
    if(!validateInputs(data)) return;

    const en = buildEN(data);
    const ru = buildRU(data);

    $("outEN").textContent = en;
    $("outRU").textContent = ru;

    $("sevPill").textContent = `Severity: ${data.severity}`;
    $("envPill").textContent = data.env ? `Env: ${data.env}` : "Env: —";

    // vocab (dedupe)
    const known = loadKnown();
    const vocabItems = collectVocab(en);

    const newItems = [];
    for(const it of vocabItems){
      const key = it.en.toLowerCase();
      if(!known.has(key)){
        newItems.push(it);
        known.add(key);
      }
    }
    saveKnown(known);

    const lines = newItems.map(x => `${x.en} — ${x.ru}`).join("\n");
    state.lastVocabLines = lines;
    state.lastVocabCount = newItems.length;

    $("vocCountPill").textContent = String(state.lastVocabCount);

    const hasNew = state.lastVocabCount > 0;
    $("goVocab").disabled = !hasNew;

    if(hasNew){
      $("afterText").innerHTML =
        `Есть <b>${state.lastVocabCount}</b> новых слов/чанков. Нажми “Перейти в словарь”.`;
      $("outV").textContent = state.lastVocabLines;
      $("copy").disabled = false;
    }else{
      $("afterText").textContent =
        `Новых слов нет — всё уже было. Можно сразу нажать “Новый отчёт”.`;
      $("outV").textContent = "—";
      $("copy").disabled = true;
    }

    setTab("result");
    setResultView("en");
    toast("Готово");
  }

  function setResultView(which){
    const en = (which === "en");
    $("showEN").classList.toggle("active", en);
    $("showRU").classList.toggle("active", !en);
    $("blockEN").classList.toggle("hidden", !en);
    $("blockRU").classList.toggle("hidden", en);
  }
  on("showEN","click", ()=>setResultView("en"));
  on("showRU","click", ()=>setResultView("ru"));

  function newReport(){
    $("q1").value = "";
    $("q2").value = "";
    $("q3").value = "";
    $("q4").value = "";
    $("env").value = "";

    state.lastVocabLines = "";
    state.lastVocabCount = 0;
    state.demoOn = false;

    $("vocCountPill").textContent = "0";
    $("outV").textContent = "—";
    $("copy").disabled = true;
    $("goVocab").disabled = true;

    setTab("input");
    if(state.inputMode === "wizard"){
      state.wizardStep = 0;
      renderWizard();
    }
    focusFirstInput();
    toast("Новый отчёт");
  }

  function resetVocab(){
    localStorage.removeItem(LS_KEY);
    toast("Словарь сброшен");
  }

  function demo(){
    state.demoOn = !state.demoOn;

    if(state.demoOn){
      $("q1").value = 'Открыл приложение и нажал кнопку "Sign in".';
      $("q2").value = "Ничего не произошло, приложение зависло.";
      $("q3").value = "Должно было появиться окно логина и пароля.";
      $("q4").value = "на главном экране";
      $("q5").value = "High";
      $("env").value = "iPhone 13, iOS 18.2, App v1.2.0";
      $("type").value = "crash";
      toast("Демо заполнено");
    }else{
      $("q1").value = "";
      $("q2").value = "";
      $("q3").value = "";
      $("q4").value = "";
      $("env").value = "";
      $("q5").value = "Medium";
      $("type").value = "functional";
      toast("Демо очищено");
    }

    if(state.inputMode === "wizard"){
      renderWizard();
      wizardFocus();
    }
  }

  async function copyVocab(){
    const text = (state.lastVocabLines || "").trim();
    if(!text){
      toast("Нечего копировать");
      return;
    }
    try{
      await navigator.clipboard.writeText(text);
      toast("Copied");
    }catch{
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      toast("Copied");
    }
  }

  // ---------- wizard ----------
  const WIZ_STEPS = [
    { key:"q1", label:"Что ты сделал?", help:"", type:"textarea", placeholder:"" },
    { key:"q2", label:"Что произошло?", help:"", type:"textarea", placeholder:"" },
    { key:"q3", label:"Что должно было произойти?", help:"", type:"textarea", placeholder:"" },
    { key:"q4", label:"Где это произошло?", help:"", type:"input", placeholder:"" },
    { key:"q5", label:"Насколько это критично?", help:"", type:"select",
      options:[ ["Low","Низко"], ["Medium","Средне"], ["High","Высоко"], ["Critical","Критично"] ] },
    { key:"env", label:"Устройство / версия", help:"", type:"input", placeholder:"" },
    { key:"type", label:"Тип бага", help:"", type:"select",
      options:[ ["functional","Функциональный"], ["ui","UI/Дизайн"], ["typo","Орфография/Текст"], ["crash","Краш/Зависание"] ] }
  ];

  function renderWizard(){
    const idx = state.wizardStep;
    const step = WIZ_STEPS[idx];

    $("wizProgress").textContent = `Шаг ${idx+1}/${WIZ_STEPS.length}`;
    $("wizLabel").innerHTML = `<span class="n" id="wizN">${idx+1}</span> ${step.label}`;
    $("wizHelp").textContent = step.help || "";

    const host = $("wizField");
    host.innerHTML = "";

    let el;
    if(step.type === "textarea"){
      el = document.createElement("textarea");
      el.placeholder = step.placeholder || "";
      el.value = $(step.key).value;
      el.addEventListener("input", ()=>{ $(step.key).value = el.value; });
    }else if(step.type === "input"){
      el = document.createElement("input");
      el.placeholder = step.placeholder || "";
      el.value = $(step.key).value;
      el.addEventListener("input", ()=>{ $(step.key).value = el.value; });
    }else if(step.type === "select"){
      el = document.createElement("select");
      step.options.forEach(([val, txt])=>{
        const opt = document.createElement("option");
        opt.value = val;
        opt.textContent = txt;
        el.appendChild(opt);
      });
      el.value = $(step.key).value;
      el.addEventListener("change", ()=>{ $(step.key).value = el.value; });
    }

    el.id = "wizActiveField";
    host.appendChild(el);

    $("wizBack").disabled = (idx === 0);
    const last = (idx === WIZ_STEPS.length - 1);
    $("wizNext").classList.toggle("hidden", last);
    $("wizGen").classList.toggle("hidden", !last);

    el.addEventListener("keydown", (e)=>{
      if(e.key !== "Enter") return;
      if(step.type === "textarea" && e.shiftKey) return;
      e.preventDefault();
      if(last) generate();
      else wizardNext();
    });
  }

  function wizardFocus(){
    const el = $("wizActiveField");
    if(el) el.focus();
  }

  function wizardNext(){
    if(state.wizardStep < WIZ_STEPS.length - 1){
      state.wizardStep += 1;
      renderWizard();
      wizardFocus();
    }
  }
  function wizardBack(){
    if(state.wizardStep > 0){
      state.wizardStep -= 1;
      renderWizard();
      wizardFocus();
    }
  }

  on("wizNext","click", wizardNext);
  on("wizBack","click", wizardBack);
  on("wizGen","click", generate);

  // ---------- init ----------
  on("genForm","click", generate);
  on("demo","click", demo);

  ["newReport","newReport2","newReport3","newReport4"].forEach(id=>{
    on(id,"click", newReport);
  });

  on("resetVocab3","click", resetVocab);
  on("copy","click", copyVocab);

  on("goVocab","click", ()=>{
    if($("goVocab").disabled) return;
    setTab("vocab");
  });

  setTab("input");
  setInputMode("form");
  $("goVocab").disabled = true;
  $("copy").disabled = true;
</script>
</body>
</html>
