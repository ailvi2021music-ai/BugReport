<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Bug Report Trainer</title>
  <meta name="theme-color" content="#071221" />

  <style>
    :root{
      --bg0:#050914;
      --bg1:#071221;
      --line:rgba(140,195,255,.14);
      --text:#EAF2FF;
      --muted2:rgba(234,242,255,.55);
      --accent:#59C3FF;
      --good:#3CE07A;
      --warn:#FFD166;
      --bad:#FF5C7A;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --shadow2: 0 10px 30px rgba(0,0,0,.35);
      --r:18px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, system-ui, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      -webkit-font-smoothing:antialiased;
      -webkit-text-size-adjust:100%;
      overflow-x:hidden;
      caret-color: transparent;
    }
    textarea, input, select{ caret-color: var(--text); }

    body::before{
      content:"";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(89,195,255,.20), transparent 60%),
        radial-gradient(900px 700px at 80% 30%, rgba(75,227,209,.14), transparent 55%),
        radial-gradient(900px 700px at 60% 90%, rgba(255,92,122,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    .wrap{
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 14px;
      min-height: 100svh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      width: 100%;
      background: linear-gradient(180deg, rgba(11,23,48,.92), rgba(10,20,43,.90));
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      overflow:hidden;
    }

    .cardHead{
      padding: 12px 14px 0;
      display:flex;
      align-items:center;
      justify-content:flex-start;
    }

    .cardBody{ padding: 14px; }
    .hidden{ display:none !important; }

    .q{
      padding: 12px;
      border: 1px solid rgba(140,195,255,.12);
      border-radius: 14px;
      background: rgba(5,9,20,.35);
      margin-bottom: 10px;
    }
    .q label{
      display:flex;
      gap:10px;
      align-items:center;
      color: rgba(234,242,255,.90);
      font-size: 13px;
      margin-bottom: 8px;
      user-select:none;
      cursor: default;
    }
    .n{
      width: 22px; height: 22px;
      border-radius: 8px;
      display:grid; place-items:center;
      background: rgba(89,195,255,.14);
      border: 1px solid rgba(89,195,255,.22);
      color: rgba(234,242,255,.92);
      font-size: 12px;
      flex: 0 0 auto;
      user-select:none;
      cursor: default;
    }

    textarea, input, select{
      width:100%;
      background: rgba(234,242,255,.06);
      border: 1px solid rgba(140,195,255,.16);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 11px;
      outline: none;
      font-size: 14px;
      line-height: 1.35;
    }
    textarea{ min-height: 54px; resize: vertical; }
    textarea:focus, input:focus, select:focus{
      border-color: rgba(89,195,255,.38);
      box-shadow: 0 0 0 4px rgba(89,195,255,.10);
    }

    select{
      background-color: rgba(234,242,255,.06);
      color: rgba(234,242,255,.92);
      border: 1px solid rgba(140,195,255,.16);
    }
    select option{
      background-color: #0b162e;
      color: #eaf2ff;
    }

    .row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    @media (max-width:520px){ .row{ grid-template-columns: 1fr; } }

    .btnRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 12px;
      align-items:center;
      justify-content:flex-start;
    }
    .btnRow.split{ justify-content:space-between; }
    .btnGroup{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .btn{
      border:1px solid rgba(89,195,255,.25);
      color: rgba(234,242,255,.92);
      background: rgba(89,195,255,.10);
      padding: 11px 14px;
      border-radius: 14px;
      cursor:pointer;
      font-size:14px;
      letter-spacing:.2px;
      transition: transform .08s ease, filter .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{ filter: brightness(1.06); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      background: linear-gradient(180deg, rgba(89,195,255,.30), rgba(89,195,255,.14));
      border-color: rgba(89,195,255,.40);
      box-shadow: 0 14px 40px rgba(89,195,255,.10);
    }
    .btn.ghost{
      background: transparent;
      border-color: rgba(234,242,255,.12);
      color: rgba(234,242,255,.75);
    }
    .btn.danger{
      background: rgba(255,92,122,.10);
      border-color: rgba(255,92,122,.25);
      color: rgba(234,242,255,.88);
    }
    .btn[disabled]{ opacity:.45; cursor:not-allowed; filter:none; transform:none; }

    .btn.back{
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 13px;
      background: rgba(234,242,255,.06);
      border-color: rgba(234,242,255,.12);
      color: rgba(234,242,255,.86);
    }

    .btnIcon{
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 999px;
      display:grid;
      place-items:center;
      font-size: 16px;
      line-height: 1;
      font-weight: 800;
    }

    /* Тумблер режима репорта (👁️ / 🖥️) — БЕЗ внешней капсулы */
    .modeToggle{
      border: none;
      background: transparent;
      padding: 0;
      border-radius: 0;
      cursor:pointer;
      display:flex;
      align-items:center;
      user-select:none;
      transition: transform .08s ease, filter .12s ease;
    }
    .modeToggle:hover{ filter: brightness(1.06); }
    .modeToggle:active{ transform: translateY(1px); }

    .switch{
      width: 62px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(89,195,255,.22);
      background: rgba(89,195,255,.08);
      position: relative;
      flex: 0 0 auto;
      overflow:hidden;
    }
    .switch .icons{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 0 8px;
      font-size: 14px;
      opacity:.85;
      pointer-events:none;
    }
    .knob{
      width: 22px;
      height: 22px;
      border-radius: 999px;
      position: absolute;
      top: 1px;
      left: 1px;
      background: rgba(234,242,255,.88);
      transition: left .14s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,.35);
    }
    .modeToggle.on .switch{
      background: linear-gradient(180deg, rgba(89,195,255,.26), rgba(89,195,255,.12));
      border-color: rgba(89,195,255,.40);
    }
    .modeToggle.on .knob{ left: 39px; }

    .seg{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-start;
      margin-bottom:12px;
    }
    .segBtn{
      border:1px solid rgba(234,242,255,.12);
      background: rgba(234,242,255,.06);
      color: rgba(234,242,255,.80);
      padding: 8px 10px;
      border-radius: 999px;
      cursor:pointer;
      font-size: 13px;
      user-select:none;
      transition: filter .12s ease, transform .08s ease, background .12s ease, border-color .12s ease;
      white-space: nowrap;
    }
    .segBtn:hover{ filter: brightness(1.06); }
    .segBtn:active{ transform: translateY(1px); }
    .segBtn.active{
      border-color: rgba(89,195,255,.35);
      background: rgba(89,195,255,.12);
      color: rgba(234,242,255,.92);
    }

    .outBlock{
      padding: 12px 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(140,195,255,.12);
      background: rgba(5,9,20,.35);
      margin-bottom: 10px;
    }
    .outTitle{
      display:flex;
      align-items:center;
      gap:10px;
      margin: 0 0 10px;
      font-size: 13px;
      color: rgba(234,242,255,.92);
      letter-spacing:.2px;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .dot{
      width: 10px; height: 10px; border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(89,195,255,.12);
      flex: 0 0 auto;
    }
    .dot.good{ background: var(--good); box-shadow: 0 0 0 4px rgba(60,224,122,.10); }
    .dot.warn{ background: var(--warn); box-shadow: 0 0 0 4px rgba(255,209,102,.10); }
    .dot.bad{ background: var(--bad); box-shadow: 0 0 0 4px rgba(255,92,122,.10); }

    pre{
      margin:0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(234,242,255,.92);
    }
    .small{
      color: var(--muted2);
      font-size: 12px;
      line-height: 1.35;
      margin-top: 8px;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(10,20,43,.92);
      border: 1px solid rgba(89,195,255,.20);
      color: rgba(234,242,255,.92);
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 99;
      max-width: min(520px, calc(100vw - 24px));
      text-align:center;
      font-size: 13px;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    /* Wizard */
    .wizardShell{ display:flex; flex-direction:column; gap:10px; }
    .wizardTop{
      display:flex;
      justify-content:space-between;
      alignitems:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom: 4px;
    }
    .progress{
      color: rgba(234,242,255,.78);
      font-size: 12px;
      user-select:none;
      cursor: default;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(234,242,255,.14);
      background: rgba(234,242,255,.06);
      color: rgba(234,242,255,.86);
      user-select:none;
      cursor: default;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="card" id="mainCard">

      <div class="cardHead hidden" id="cardHead">
        <button class="btn back" id="backBtn" type="button">← Назад</button>
      </div>

      <div class="cardBody">

        <!-- INPUT PANEL -->
        <div id="panelInput">

          <!-- FORM MODE -->
          <div id="formMode">
            <div class="q">
              <label id="label1"><span class="n">1</span> Контекст / шаги</label>
              <textarea id="q1"></textarea>
            </div>

            <div class="q">
              <label id="label2"><span class="n">2</span> Что не так сейчас?</label>
              <textarea id="q2"></textarea>
            </div>

            <div class="q">
              <label id="label3"><span class="n">3</span> Как должно быть?</label>
              <textarea id="q3"></textarea>
            </div>

            <div class="row">
              <div class="q" style="margin:0;">
                <label><span class="n">4</span> Где это произошло?</label>
                <input id="q4" />
              </div>

              <div class="q" style="margin:0;">
                <label><span class="n">5</span> Насколько это критично?</label>
                <select id="q5">
                  <option value="Low">Низко</option>
                  <option value="Medium" selected>Средне</option>
                  <option value="High">Высоко</option>
                  <option value="Critical">Критично</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="q" style="margin:0;">
                <label><span class="n">6</span> Устройство / версия</label>
                <input id="env" />
              </div>

              <div class="q" style="margin:0;">
                <label><span class="n">7</span> Тип бага</label>
                <select id="type">
                  <option value="functional" selected>Функциональный</option>
                  <option value="ui">UI/Дизайн</option>
                  <option value="typo">Орфография/Текст</option>
                  <option value="crash">Краш/Зависание</option>
                </select>
              </div>
            </div>

            <div class="btnRow split">
              <div class="btnGroup">
                <button class="btn primary" id="genForm" type="button">Сгенерировать</button>
                <button class="btn" id="newReport" type="button">Новый отчёт</button>
              </div>
              <div class="btnGroup">
                <!-- Поменяли местами: тумблер, потом ? ближе к краю -->
                <button class="modeToggle" id="reportModeToggle" type="button"
                        aria-label="Режим репорта (увидел / действовал)" aria-pressed="false" title="Режим репорта">
                  <span class="switch" aria-hidden="true">
                    <span class="icons">👁️<span style="opacity:.0;">.</span>🖥️</span>
                    <span class="knob"></span>
                  </span>
                </button>
                <button class="btn ghost btnIcon" id="demo" type="button" aria-label="Демо" title="Демо">?</button>
              </div>
            </div>

            <div class="small" id="modeHint">Режим: 👁️ увидел (без действий)</div>
          </div>

          <!-- WIZARD MODE (оставили как есть, но он теперь просто "по шагам ввода", если захочешь вернуть позже) -->
          <div id="wizardMode" class="hidden">
            <div class="wizardShell">
              <div class="wizardTop">
                <div class="progress" id="wizProgress">Шаг 1/7</div>
                <div class="small">
                  <span class="kbd">Enter</span> = далее • <span class="kbd">Shift+Enter</span> = новая строка
                </div>
              </div>

              <div class="q" id="wizBox">
                <label id="wizLabel"><span class="n" id="wizN">1</span> —</label>
                <div id="wizField"></div>
                <div class="small" id="wizHelp"></div>
              </div>

              <div class="btnRow split">
                <div class="btnGroup">
                  <button class="btn ghost" id="wizBack" type="button">Назад</button>
                  <button class="btn primary" id="wizNext" type="button">Далее</button>
                  <button class="btn primary hidden" id="wizGen" type="button">Сгенерировать</button>
                  <button class="btn" id="newReport2" type="button">Новый отчёт</button>
                </div>

                <div class="btnGroup">
                  <button class="modeToggle on" id="reportModeToggle2" type="button"
                          aria-label="Режим репорта (увидел / действовал)" aria-pressed="true" title="Режим репорта">
                    <span class="switch" aria-hidden="true">
                      <span class="icons">👁️<span style="opacity:.0;">.</span>🖥️</span>
                      <span class="knob"></span>
                    </span>
                  </button>
                  <button class="btn ghost btnIcon" id="demo2" type="button" aria-label="Демо" title="Демо">?</button>
                </div>
              </div>

              <div class="small" id="modeHint2">Режим: 👁️ увидел (без действий)</div>
            </div>
          </div>

        </div>

        <!-- RESULT PANEL -->
        <div id="panelResult" class="hidden">
          <div class="seg">
            <button class="segBtn active" id="showEN" type="button">EN</button>
            <button class="segBtn" id="showRU" type="button">RU</button>
          </div>

          <div class="outBlock" id="blockEN">
            <div class="outTitle">
              <span style="display:flex; align-items:center; gap:10px;"><span class="dot"></span> Bug Report (EN)</span>
              <span class="small" id="sevPill">—</span>
            </div>
            <pre id="outEN">—</pre>
          </div>

          <div class="outBlock hidden" id="blockRU">
            <div class="outTitle">
              <span style="display:flex; align-items:center; gap:10px;"><span class="dot good"></span> Перевод (RU)</span>
              <span class="small" id="envPill">—</span>
            </div>
            <pre id="outRU">—</pre>
          </div>

          <div class="outBlock" id="blockAfter">
            <div class="outTitle">
              <span style="display:flex; align-items:center; gap:10px;"><span class="dot warn"></span> Словарь</span>
            </div>
            <div class="small" id="afterText">—</div>

            <div class="btnRow">
              <button class="btn primary" id="goVocab" type="button">Перейти в словарь</button>
              <button class="btn" id="newReport3" type="button">Новый отчёт</button>
            </div>
          </div>
        </div>

        <!-- VOCAB PANEL -->
        <div id="panelVocab" class="hidden">

          <div class="outBlock">
            <div class="outTitle">
              <span style="display:flex; align-items:center; gap:10px;"><span class="dot warn"></span> Новые (этот отчёт)</span>
              <span class="small" id="vocNewCountPill">0</span>
            </div>
            <pre id="outVNew">—</pre>

            <div class="btnRow" style="margin-top:10px;">
              <button class="btn primary" id="copyNew" type="button">Copy new</button>
            </div>
          </div>

          <div class="outBlock">
            <div class="outTitle">
              <span style="display:flex; align-items:center; gap:10px;"><span class="dot"></span> Все слова</span>
              <span class="small" id="vocAllCountPill">0</span>
            </div>
            <pre id="outVAll">—</pre>

            <div class="btnRow" style="margin-top:10px;">
              <button class="btn primary" id="copyAll" type="button">Copy all</button>
              <button class="btn" id="newReport4" type="button">Новый отчёт</button>
              <button class="btn danger" id="resetVocab3" type="button">Сбросить словарь</button>
            </div>
          </div>

        </div>

      </div>
    </section>
  </div>

  <div class="toast" id="toast">OK</div>

<script>
  // ========= CONFIG =========
  // 1) Сюда вставь URL своего Cloudflare Worker endpoint (после деплоя)
  const AI_ENDPOINT = "https://YOUR-WORKER.SUBDOMAIN.workers.dev"; // <-- поменяй

  // 2) Если включишь APP_TOKEN в Worker, задай тут тот же токен
  //    (можно оставить пустым, если в Worker APP_TOKEN не задан)
  const APP_TOKEN = ""; // например: "my-super-long-token"

  // ========= utils =========
  const $ = (id) => document.getElementById(id);
  function on(id, evt, fn){ const el = $(id); if(el) el.addEventListener(evt, fn); }

  function toast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"), 1400);
  }

  function cleanSpaces(s){ return (s||"").replace(/\s+/g," ").trim(); }

  // ========= state =========
  const state = {
    tab: "input",           // input | result | vocab
    inputMode: "form",      // form | wizard (wizard оставлен, но не обязателен)
    wizardStep: 0,
    reportMode: "observe",  // observe | interact
    demoOn: false,
    lastNewVocab: [],
  };

  // ========= panels =========
  const panels = {
    input: $("panelInput"),
    result: $("panelResult"),
    vocab: $("panelVocab")
  };

  function setTab(name){
    state.tab = name;
    Object.entries(panels).forEach(([k, el])=>{
      el.classList.toggle("hidden", k !== name);
    });
    $("cardHead").classList.toggle("hidden", name === "input");
    if(name === "vocab") renderVocabPanel();
    if(name === "input") focusFirstInput();
  }

  function focusFirstInput(){
    if(state.inputMode === "form") $("q1").focus();
    else wizardFocus();
  }

  // ========= click empty area -> blur =========
  function blurIfClickedOnEmptyArea(e){
    const q = e.target.closest(".q");
    if(!q) return;
    const interactive = e.target.closest("textarea, input, select, button");
    if(interactive) return;
    const ae = document.activeElement;
    if(ae && q.contains(ae) && /^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName)) ae.blur();
    e.preventDefault();
    e.stopPropagation();
  }
  document.addEventListener("mousedown", blurIfClickedOnEmptyArea, true);
  document.addEventListener("click", blurIfClickedOnEmptyArea, true);

  // ========= back =========
  on("backBtn","click", ()=>{
    if(state.tab === "vocab") setTab("result");
    else setTab("input");
  });

  // ========= report mode toggle (👁️ / 🖥️) =========
  function renderReportModeUI(){
    const onInteract = (state.reportMode === "interact");
    $("reportModeToggle").classList.toggle("on", onInteract);
    $("reportModeToggle").setAttribute("aria-pressed", String(onInteract));
    $("modeHint").textContent = onInteract ? "Режим: 🖥️ действовал (воспроизвёл)" : "Режим: 👁️ увидел (без действий)";

    $("reportModeToggle2").classList.toggle("on", onInteract);
    $("reportModeToggle2").setAttribute("aria-pressed", String(onInteract));
    $("modeHint2").textContent = onInteract ? "Режим: 🖥️ действовал (воспроизвёл)" : "Режим: 👁️ увидел (без действий)";
  }

  function toggleReportMode(){
    state.reportMode = (state.reportMode === "observe") ? "interact" : "observe";
    renderReportModeUI();
  }

  on("reportModeToggle","click", toggleReportMode);
  on("reportModeToggle2","click", toggleReportMode);
  renderReportModeUI();

  // ========= local vocab storage =========
  const LS_ALL = "bugTrainer_allVocab_ai_v1";

  function loadAllVocab(){
    try{
      const raw = localStorage.getItem(LS_ALL);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch{ return []; }
  }
  function saveAllVocab(arr){
    localStorage.setItem(LS_ALL, JSON.stringify(arr));
  }
  function dedupeLines(lines){
    const seen = new Set();
    const out = [];
    for(const line of lines){
      const key = String(line||"").trim().toLowerCase();
      if(!key) continue;
      if(seen.has(key)) continue;
      seen.add(key);
      out.push(line);
    }
    return out;
  }

  // ========= result view =========
  function setResultView(which){
    const en = (which === "en");
    $("showEN").classList.toggle("active", en);
    $("showRU").classList.toggle("active", !en);
    $("blockEN").classList.toggle("hidden", !en);
    $("blockRU").classList.toggle("hidden", en);
  }
  on("showEN","click", ()=>setResultView("en"));
  on("showRU","click", ()=>setResultView("ru"));

  // ========= collect inputs =========
  function gatherInputs(){
    return {
      mode: state.reportMode,
      type: $("type").value,
      severity: $("q5").value,
      location_ru: cleanSpaces($("q4").value),
      env_text: cleanSpaces($("env").value),
      q1: cleanSpaces($("q1").value),
      q2: cleanSpaces($("q2").value),
      q3: cleanSpaces($("q3").value),
    };
  }

  function validateInputs(data){
    if(!data.q2 || !data.q3){
      toast("Заполни: что не так сейчас + как должно быть");
      return false;
    }
    return true;
  }

  // ========= demo toggle =========
  function demo(){
    state.demoOn = !state.demoOn;

    if(state.demoOn){
      $("q1").value = 'Открыл страницу и нажал кнопку "Sign in".';
      $("q2").value = "Ничего не произошло, приложение зависло.";
      $("q3").value = "Должно было появиться окно логина и пароля.";
      $("q4").value = "на главном экране";
      $("q5").value = "High";
      $("env").value = "iPhone 13, iOS 18.2, App v1.2.0";
      $("type").value = "crash";
      state.reportMode = "interact";
      renderReportModeUI();
      toast("Демо заполнено");
    }else{
      $("q1").value = "";
      $("q2").value = "";
      $("q3").value = "";
      $("q4").value = "";
      $("env").value = "";
      $("q5").value = "Medium";
      $("type").value = "functional";
      state.reportMode = "observe";
      renderReportModeUI();
      toast("Демо очищено");
    }
  }
  on("demo","click", demo);
  on("demo2","click", demo);

  // ========= AI call =========
  function setLoading(isLoading){
    $("genForm").disabled = isLoading;
    $("newReport").disabled = isLoading;
    if($("wizGen")) $("wizGen").disabled = isLoading;
  }

  async function generateAI(){
    const data = gatherInputs();
    if(!validateInputs(data)) return;

    if(!AI_ENDPOINT || AI_ENDPOINT.includes("YOUR-WORKER")){
      toast("Сначала вставь AI_ENDPOINT (URL Worker)");
      return;
    }

    setLoading(true);
    $("outEN").textContent = "Генерирую…";
    $("outRU").textContent = "Генерирую…";
    $("sevPill").textContent = `Severity: ${data.severity}`;
    $("envPill").textContent = data.env_text ? `Env: ${data.env_text}` : "Env: —";

    try{
      const resp = await fetch(AI_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(APP_TOKEN ? {"Authorization": `Bearer ${APP_TOKEN}`} : {})
        },
        body: JSON.stringify(data)
      });

      const json = await resp.json().catch(()=> ({}));
      if(!resp.ok){
        const msg = json && (json.error || json.detail) ? (json.error + (json.detail ? (": " + json.detail) : "")) : "Ошибка AI";
        $("outEN").textContent = "—";
        $("outRU").textContent = "—";
        toast(msg.slice(0,120));
        setTab("result");
        setResultView("en");
        return;
      }

      // ожидаем: { en_report, ru_report, new_vocab:[{en,ru}] }
      const en = (json.en_report || "—").trim();
      const ru = (json.ru_report || "—").trim();
      const newVocab = Array.isArray(json.new_vocab) ? json.new_vocab : [];

      $("outEN").textContent = en || "—";
      $("outRU").textContent = ru || "—";

      // vocab: новое + накопительное
      state.lastNewVocab = newVocab
        .filter(x=>x && x.en && x.ru)
        .slice(0,15);

      const newLines = state.lastNewVocab.map(x => `${x.en} — ${x.ru}`);
      const all = loadAllVocab();
      const merged = dedupeLines(all.concat(newLines));
      saveAllVocab(merged);

      $("afterText").textContent = state.lastNewVocab.length
        ? `Новых для словаря: ${state.lastNewVocab.length}.`
        : `Новых для словаря нет.`;

      setTab("result");
      setResultView("en");
      toast("Готово");
    }catch(err){
      $("outEN").textContent = "—";
      $("outRU").textContent = "—";
      toast("Ошибка сети / Worker");
      setTab("result");
      setResultView("en");
    }finally{
      setLoading(false);
    }
  }

  on("genForm","click", generateAI);

  // ========= vocab panel =========
  function renderVocabPanel(){
    const newLines = (state.lastNewVocab || []).map(x => `${x.en} — ${x.ru}`);
    const allArr = loadAllVocab();

    $("vocNewCountPill").textContent = String(newLines.length);
    $("outVNew").textContent = newLines.length ? newLines.join("\n") : "—";
    $("copyNew").disabled = !newLines.length;

    $("vocAllCountPill").textContent = String(allArr.length);
    $("outVAll").textContent = allArr.length ? allArr.join("\n") : "—";
    $("copyAll").disabled = !allArr.length;
  }

  // ========= new report / reset =========
  function newReport(){
    $("q1").value = "";
    $("q2").value = "";
    $("q3").value = "";
    $("q4").value = "";
    $("env").value = "";
    $("q5").value = "Medium";
    $("type").value = "functional";

    state.demoOn = false;
    state.lastNewVocab = [];
    state.reportMode = "observe";
    renderReportModeUI();

    setTab("input");
    toast("Новый отчёт");
  }

  function resetVocab(){
    localStorage.removeItem(LS_ALL);
    state.lastNewVocab = [];
    if(state.tab === "vocab") renderVocabPanel();
    toast("Словарь сброшен");
  }

  async function copyText(text){
    const t = (text || "").trim();
    if(!t){ toast("Нечего копировать"); return; }
    try{
      await navigator.clipboard.writeText(t);
      toast("Copied");
    }catch{
      const ta = document.createElement("textarea");
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      toast("Copied");
    }
  }

  on("goVocab","click", ()=>setTab("vocab"));

  ["newReport","newReport2","newReport3","newReport4"].forEach(id=> on(id,"click", newReport));
  on("resetVocab3","click", resetVocab);

  on("copyNew","click", ()=>{
    const newLines = (state.lastNewVocab || []).map(x => `${x.en} — ${x.ru}`).join("\n");
    copyText(newLines);
  });
  on("copyAll","click", ()=>{
    const allText = loadAllVocab().join("\n");
    copyText(allText);
  });

  // init
  setTab("input");
  $("sevPill").textContent = "—";
  $("envPill").textContent = "Env: —";
</script>
</body>
</html>
